<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Under Construction</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --text: #1c2430;
      --muted: #5b6676;
      --accent: #f5b301;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c;
        --text: #e8ecf2;
        --muted: #9aa5b5;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      text-align: center;
      color: var(--text);
      background: var(--bg);
    }

    .tape {
      width: 100%;
      max-width: 32rem;
      height: 1rem;
      margin-bottom: 2rem;
      border-radius: 2px;
      background: repeating-linear-gradient(
        -45deg,
        var(--accent) 0 1rem,
        #1c2430 1rem 2rem
      );
    }

    .tape:last-of-type {
      margin: 2rem 0 0;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
    }

    p {
      max-width: 30rem;
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <main>
    <h1>Under Construction</h1>
    <p>This site is being built. Please check back soon.</p>
  </main>
  <div class="tape" aria-hidden="true"></div>
</body>
</html>
